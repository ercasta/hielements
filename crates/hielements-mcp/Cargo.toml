[package]
name = "hielements-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MCP (Model Context Protocol) server for Hielements"

[[bin]]
name = "hielements-mcp"
path = "src/main.rs"

[dependencies]
hielements-core = { path = "../hielements-core" }

# MCP protocol implementation
rust-mcp-sdk = { version = "0.8.1", default-features = false, features = ["server", "macros", "stdio"] }

# Async
async-trait = "0.1"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# CLI arguments
clap.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.25"
